<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestionnaire de Patrimoine Multi-Comptes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Client JS Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @font-face {
            font-family: 'Google Sans';
            src: url('https://fonts.gstatic.com/s/googlesans/v58/4UaRrENHsxJlGDuGo1OIlJfC6l_24rlCK1Yo_Iq2vgCI.woff2') format('woff2');
            font-weight: 400 700;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --ff-sans: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --ff-mono: 'SF Mono', 'Menlo', Monaco, Consolas, monospace;

            --bg: #0f172a;
            --surface: #1e293b;
            --surface-hover: #334155;
            --border: #334155;
            
            --text: #f8fafc;
            --text-muted: #94a3b8;
            
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --positive: #4ade80;
            --negative: #f87171;
            
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--ff-sans);
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            max-width: 400px;
            width: 100%;
            margin: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 13px;
            color: var(--text-muted);
        }

        .hidden { display: none !important; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
        .subtitle { color: var(--text-muted); font-size: 13px; margin-top: 2px; }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }

        .metric-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .metric-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .metric-value { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
        .metric-sub { font-size: 12px; font-weight: 500; }

        .text-positive { color: var(--positive); }
        .text-negative { color: var(--negative); }
        .text-primary { color: var(--primary); }

        .main-layout {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 16px;
        }

        @media (max-width: 850px) {
            .main-layout { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .card-title { font-size: 16px; font-weight: 600; }

        .chart-wrapper {
            position: relative;
            width: 100%;
            max-width: 280px;
            aspect-ratio: 1;
            margin: 0 auto;
        }

        #donut-chart { width: 100%; height: 100%; overflow: visible; }

        .donut-slice {
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
            transform-origin: center;
            outline: none;
        }

        .donut-slice:hover, .donut-slice:active { transform: scale(1.04); }

        .center-title { font-size: 12px; fill: var(--text-muted); text-anchor: middle; }
        .center-value { font-size: 22px; font-weight: 700; fill: var(--text); text-anchor: middle; }
        .center-sub { font-size: 12px; fill: var(--text-muted); text-anchor: middle; }

        /* Style adaptatif des items (Tableau PC / Cartes Mobile) */
        .items-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .item-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-row-top {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .item-row-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .item-row-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 6px;
            border-top: 1px dashed var(--border);
            font-size: 13px;
        }

        .toggle-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
            background: var(--surface);
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }

        .input-text, .input-num {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 12px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-family: inherit;
            width: 100%;
        }

        .input-text:focus, .input-num:focus { outline: none; border-color: var(--primary); }
        .input-num { text-align: right; font-family: var(--ff-mono); }
        
        .input-color-wrapper {
            position: relative;
            width: 36px;
            height: 36px;
            min-width: 36px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--border);
        }

        .input-color {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            cursor: pointer;
            border: none;
        }

        .input-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: var(--primary);
            color: #0f172a;
            border: none;
            border-radius: var(--radius-md);
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            min-height: 44px;
        }

        .btn:hover { background: var(--primary-hover); }
        .btn-danger { background: transparent; color: var(--negative); padding: 8px; border-radius: var(--radius-sm); min-height: 36px; }
        .btn-danger:hover { background: rgba(248, 113, 113, 0.1); }
        .btn-secondary { background: var(--surface-hover); color: var(--text); }
        .btn-logout { background: transparent; color: var(--negative); border: 1px solid var(--negative); padding: 8px 12px; }

        .actions-bar { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }

        @media (min-width: 600px) {
            .actions-bar { flex-direction: row; justify-content: space-between; }
        }

        .badge-pct { font-family: var(--ff-mono); font-size: 13px; font-weight: 600; }

        .tooltip {
            position: fixed;
            background: #090d16;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 13px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
            z-index: 1000;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        @media (max-width: 600px) {
            .tooltip {
                left: 16px !important;
                right: 16px !important;
                bottom: 16px !important;
                top: auto !important;
                width: auto;
            }
        }

        .tooltip-header { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
        .tooltip-dot { width: 10px; height: 10px; border-radius: 50%; }
        .tooltip-body { color: var(--text-muted); font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
    </style>
</head>
<body>

    <!-- Écran de Connexion -->
    <div id="login-screen" class="login-card">
        <h2 style="text-align: center;">Connexion</h2>
        <form id="login-form">
            <div class="input-group">
                <label>Adresse E-mail</label>
                <input type="email" id="email" class="input-text" required placeholder="nom@exemple.com">
            </div>
            <div class="input-group" style="margin-top: 12px;">
                <label>Mot de passe</label>
                <input type="password" id="password" class="input-text" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn" style="width: 100%; margin-top: 20px;">Se connecter</button>
            <div id="login-error" style="color: var(--negative); font-size: 13px; margin-top: 12px; text-align: center;"></div>
        </form>
    </div>

    <!-- Application Dashboard -->
    <div id="app-container" class="container hidden">
        <header>
            <div>
                <h1>Patrimoine & PV</h1>
                <div class="subtitle" id="user-display">...</div>
            </div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="saveData()">💾</button>
                <button class="btn btn-logout" onclick="logout()">🚪</button>
            </div>
        </header>

        <div class="metrics-grid">
            <div class="metric-card">
                <span class="metric-label">Patrimoine</span>
                <span class="metric-value" id="total-val">0 €</span>
                <span class="metric-sub text-primary">Valeur totale</span>
            </div>
            <div class="metric-card">
                <span class="metric-label">Capital</span>
                <span class="metric-value" id="invested-val">0 €</span>
                <span class="metric-sub" style="color: var(--text-muted)">Versements</span>
            </div>
            <div class="metric-card" style="grid-column: span 2;">
                <span class="metric-label">Plus-Value (Sélection)</span>
                <div style="display: flex; justify-content: space-between; align-items: baseline;">
                    <span class="metric-value" id="gain-val">0 €</span>
                    <span class="metric-sub" id="gain-pct-badge">+0.00%</span>
                </div>
            </div>
        </div>

        <div class="main-layout">
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Répartition Visuelle</span>
                </div>
                <div class="chart-wrapper">
                    <svg id="donut-chart" viewBox="-160 -160 320 320">
                        <g id="slices-group"></g>
                        <g class="center-group">
                            <text class="center-title" y="-18">Sélection</text>
                            <text class="center-value" id="center-total" y="10">0 €</text>
                            <text class="center-sub" id="center-sub" y="32">0 supports</text>
                        </g>
                    </svg>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title">Supports</span>
                </div>
                
                <div id="items-container" class="items-list"></div>

                <div class="actions-bar">
                    <button class="btn" onclick="addRow()">+ Ajouter un support</button>
                    <button class="btn btn-secondary" onclick="resetToDefault()">Réinitialiser</button>
                </div>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip">
        <div class="tooltip-header">
            <div class="tooltip-dot" id="tooltip-dot"></div>
            <span id="tooltip-title">Support</span>
        </div>
        <div class="tooltip-body">
            <div>Solde : <strong id="tooltip-val" style="color: var(--text)">0 €</strong> (<span id="tooltip-share">0%</span>)</div>
            <div>Capital : <span id="tooltip-invested">0 €</span></div>
            <div>Plus-value : <span id="tooltip-gain" class="text-positive">0 €</span> (<strong id="tooltip-gain-pct" class="text-positive">+0%</strong>)</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://xuuoeejdmzitjpsvhhmy.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1dW9lZWpkbXppdGpwc3ZoaG15Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5OTA2MTQsImV4cCI6MjEwNTU2NjYxNH0.JO0r78pD5cqOa0ZYwr_4W0CHM3tcKRzCWjgfcqCjqlg";

        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const defaultItems = [
            { id: 1, name: 'PEA', value: 6883, gain: 650, color: '#38bdf8', includeGain: true, showInChart: true },
            { id: 2, name: 'Livret A', value: 2600, gain: 0, color: '#4ade80', includeGain: false, showInChart: true },
            { id: 3, name: 'Compte courant', value: 500, gain: 0, color: '#facc15', includeGain: false, showInChart: true },
            { id: 4, name: 'Crypto', value: 367, gain: 57, color: '#f87171', includeGain: true, showInChart: true },
            { id: 5, name: 'CTO', value: 257, gain: 2.5, color: '#a855f7', includeGain: true, showInChart: true }
        ];

        let items = [];

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errDiv = document.getElementById('login-error');

            errDiv.textContent = "Connexion...";

            const { data, error } = await sbClient.auth.signInWithPassword({ email, password });

            if (error) {
                errDiv.textContent = "Identifiants incorrects.";
            } else if (data && data.user) {
                initDashboard(data.user);
            }
        });

        async function logout() {
            await sbClient.auth.signOut();
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('app-container').classList.add('hidden');
        }

        async function initDashboard(user) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('user-display').textContent = user.email;

            const { data } = await sbClient.from('patrimoine').select('data').maybeSingle();

            if (data && data.data) {
                items = data.data.map(item => ({
                    ...item,
                    includeGain: item.includeGain !== undefined ? item.includeGain : true,
                    showInChart: item.showInChart !== undefined ? item.showInChart : true
                }));
            } else {
                items = JSON.parse(JSON.stringify(defaultItems));
            }

            render();
        }

        async function saveData() {
            const { data: { user } } = await sbClient.auth.getUser();
            if (!user) return;

            const { error } = await sbClient.from('patrimoine').upsert({
                user_id: user.id,
                data: items
            }, { onConflict: 'user_id' });

            if (error) {
                alert("Erreur : " + error.message);
            } else {
                alert("Enregistré !");
            }
        }

        const fmt = (val) => new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(val);
        const fmtPct = (val) => (val >= 0 ? '+' : '') + val.toFixed(2) + '%';

        function render() {
            renderList();
            renderMetricsAndChart();
        }

        function renderList() {
            const container = document.getElementById('items-container');
            container.innerHTML = '';

            items.forEach((item, idx) => {
                const invested = item.value - item.gain;
                const gainPct = invested > 0 ? (item.gain / invested) * 100 : 0;
                const isCheckedGain = item.includeGain !== false;
                const isCheckedChart = item.showInChart !== false;

                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div class="item-row-top">
                        <div class="input-color-wrapper">
                            <input type="color" class="input-color" value="${item.color}" onchange="updateItem(${idx}, 'color', this.value)">
                        </div>
                        <input type="text" class="input-text" value="${escapeHtml(item.name)}" onchange="updateItem(${idx}, 'name', this.value)" placeholder="Nom">
                        <button class="btn-danger" onclick="deleteRow(${idx})" title="Supprimer">✕</button>
                    </div>

                    <div class="item-row-inputs">
                        <div>
                            <span style="font-size: 11px; color: var(--text-muted);">Solde (€)</span>
                            <input type="number" class="input-num" value="${item.value}" step="any" onchange="updateItem(${idx}, 'value', parseFloat(this.value) || 0)">
                        </div>
                        <div>
                            <span style="font-size: 11px; color: var(--text-muted);">Dont PV (€)</span>
                            <input type="number" class="input-num" value="${item.gain}" step="any" onchange="updateItem(${idx}, 'gain', parseFloat(this.value) || 0)">
                        </div>
                    </div>

                    <div class="item-row-bottom">
                        <div style="display: flex; gap: 8px;">
                            <label class="toggle-group">
                                <input type="checkbox" class="input-checkbox" ${isCheckedGain ? 'checked' : ''} onchange="updateItem(${idx}, 'includeGain', this.checked)">
                                PV
                            </label>
                            <label class="toggle-group">
                                <input type="checkbox" class="input-checkbox" ${isCheckedChart ? 'checked' : ''} onchange="updateItem(${idx}, 'showInChart', this.checked)">
                                Graph
                            </label>
                        </div>
                        <div>
                            <span class="badge-pct ${gainPct >= 0 ? 'text-positive' : 'text-negative'}">
                                ${fmtPct(gainPct)}
                            </span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderMetricsAndChart() {
            const totalVal = items.reduce((sum, item) => sum + item.value, 0);
            const totalGainAll = items.reduce((sum, item) => sum + item.gain, 0);
            const totalInvested = totalVal - totalGainAll;

            const filteredGain = items
                .filter(item => item.includeGain !== false)
                .reduce((sum, item) => sum + item.gain, 0);

            const filteredInvested = items
                .filter(item => item.includeGain !== false)
                .reduce((sum, item) => sum + (item.value - item.gain), 0);

            const totalGainPct = filteredInvested > 0 ? (filteredGain / filteredInvested) * 100 : 0;

            document.getElementById('total-val').textContent = fmt(totalVal);
            document.getElementById('invested-val').textContent = fmt(totalInvested);
            document.getElementById('gain-val').textContent = fmt(filteredGain);
            
            const gainBadge = document.getElementById('gain-pct-badge');
            gainBadge.textContent = fmtPct(totalGainPct);
            gainBadge.className = `metric-sub ${totalGainPct >= 0 ? 'text-positive' : 'text-negative'}`;

            const chartItems = items.filter(item => item.showInChart !== false);
            const chartTotalVal = chartItems.reduce((sum, item) => sum + item.value, 0);

            document.getElementById('center-total').textContent = fmt(chartTotalVal);
            document.getElementById('center-sub').textContent = `${chartItems.length} support${chartItems.length > 1 ? 's' : ''}`;

            const slicesGroup = document.getElementById('slices-group');
            slicesGroup.innerHTML = '';

            if (chartTotalVal <= 0) return;

            const outerRadius = 130;
            const innerRadius = 90;
            const gap = 0.03;
            let currentAngle = -Math.PI / 2;

            chartItems.forEach((item) => {
                if (item.value <= 0) return;

                const share = item.value / chartTotalVal;
                const sliceAngle = share * (Math.PI * 2);
                const startAngle = currentAngle + gap / 2;
                const endAngle = currentAngle + sliceAngle - gap / 2;

                const pathD = getArcPath(startAngle, endAngle, innerRadius, outerRadius);

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', pathD);
                path.setAttribute('fill', item.color);
                path.setAttribute('class', 'donut-slice');

                // Support mobile + PC
                const handleInteraction = (e) => showTooltip(e, item, share, chartTotalVal);
                path.addEventListener('mousemove', handleInteraction);
                path.addEventListener('click', handleInteraction);
                path.addEventListener('mouseleave', hideTooltip);

                slicesGroup.appendChild(path);

                currentAngle += sliceAngle;
            });
        }

        function getArcPath(startAngle, endAngle, innerRadius, outerRadius) {
            const x1 = outerRadius * Math.cos(startAngle);
            const y1 = outerRadius * Math.sin(startAngle);
            const x2 = outerRadius * Math.cos(endAngle);
            const y2 = outerRadius * Math.sin(endAngle);
            const x3 = innerRadius * Math.cos(endAngle);
            const y3 = innerRadius * Math.sin(endAngle);
            const x4 = innerRadius * Math.cos(startAngle);
            const y4 = innerRadius * Math.sin(startAngle);
            const largeArcFlag = (endAngle - startAngle) > Math.PI ? 1 : 0;

            return `M ${x1} ${y1} A ${outerRadius} ${outerRadius} 0 ${largeArcFlag} 1 ${x2} ${y2} L ${x3} ${y3} A ${innerRadius} ${innerRadius} 0 ${largeArcFlag} 0 ${x4} ${y4} Z`;
        }

        function updateItem(index, field, value) {
            items[index][field] = value;
            render();
        }

        function addRow() {
            const colors = ['#f43f5e', '#8b5cf6', '#06b6d4', '#10b981', '#f59e0b'];
            const randomColor = colors[items.length % colors.length];
            items.push({
                id: Date.now(),
                name: 'Nouveau',
                value: 1000,
                gain: 0,
                color: randomColor,
                includeGain: true,
                showInChart: true
            });
            render();
        }

        function deleteRow(index) {
            items.splice(index, 1);
            render();
        }

        function resetToDefault() {
            items = JSON.parse(JSON.stringify(defaultItems));
            render();
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
        }

        const tooltip = document.getElementById('tooltip');
        function showTooltip(e, item, share, totalVal) {
            e.stopPropagation();
            const invested = item.value - item.gain;
            const gainPct = invested > 0 ? (item.gain / invested) * 100 : 0;

            document.getElementById('tooltip-dot').style.backgroundColor = item.color;
            document.getElementById('tooltip-title').textContent = item.name;
            document.getElementById('tooltip-val').textContent = fmt(item.value);
            document.getElementById('tooltip-share').textContent = (share * 100).toFixed(1) + '%';
            document.getElementById('tooltip-invested').textContent = fmt(invested);
            
            const gainEl = document.getElementById('tooltip-gain');
            const gainPctEl = document.getElementById('tooltip-gain-pct');
            
            gainEl.textContent = fmt(item.gain);
            gainPctEl.textContent = fmtPct(gainPct);

            gainEl.className = item.gain >= 0 ? 'text-positive' : 'text-negative';
            gainPctEl.className = gainPct >= 0 ? 'text-positive' : 'text-negative';

            tooltip.style.opacity = '1';

            if (window.innerWidth > 600) {
                tooltip.style.left = `${e.clientX + 15}px`;
                tooltip.style.top = `${e.clientY + 15}px`;
            }
        }

        function hideTooltip() {
            tooltip.style.opacity = '0';
        }

        document.addEventListener('click', (e) => {
            if (!e.target.classList.contains('donut-slice')) {
                hideTooltip();
            }
        });
    </script>
</body>
</html>
